<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Assistenza telefoni</title>
</head>
<body class="p-4">
    <form id="form">
         <fieldset>
            <legend>DATI</legend>
            NOME <input id="nome" type="text" class="casella form-control w-25 mb-2" tabindex="1" size="15" maxlength="20">
            COGNOME <input id="cognome" type="text" class="casella form-control w-25 mb-2" tabindex="2" size="15" maxlength="20">
            CODICE FISCALE <input id="codice" type="text" class="casella form-control w-25 mb-2" tabindex="3" size="15">
            CITTA <input id="citta" type="text" class="casella form-control w-25 mb-2" tabindex="4" size="15" maxlength="15">
            GESTORE TEL <input id="gestore" type="text" class="casella form-control w-25 mb-2" tabindex="5" size="15" maxlength="40">
            NUMERO DI TELEFONO <input id="num1" type="number" class="casella form-control w-25 mb-2" tabindex="6" size="15" maxlength="15">
            MARCA DISPOSITIVO <input id="marca" type="text" class="casella form-control w-25 mb-2" tabindex="7" size="15" maxlength="15">
            MODELLO DISPOSITIVO <input id="modello" type="text" class="casella form-control w-25 mb-2" tabindex="8" size="15" maxlength="15">
            BREVE DESCRIZIONE DEL PROBLEMA <input id="descrizione" type="text" class="casella form-control w-25 mb-2" tabindex="9" size="15" maxlength="100">
            Recapito di contatto (se diverso dal numero del dispositivo in riparazione) <input id="num2" type="number" class="casella form-control w-25 mb-3" tabindex="10" size="15" maxlength="15">
            
            <input name="button" type="submit" id="submit" class="btn btn-primary" value="Invia">
        </fieldset>
    </form>

    <table id="table" class="table table-bordered w-50" style="display: none;">
        <thead>
            <tr>
                <th colspan="2">Ri-Generation – Via Pavoncelli 118, Bari<br>Ricevuta di consegna</th>
            </tr>
        </thead>
        <tbody id="table-body"></tbody>
    </table>

    
    <button id="button" class="btn btn-secondary mt-3" style="display: none;">Torna al form</button>

    <script>
        document.getElementById("form").addEventListener("submit", function(event){
            event.preventDefault(); 
            let num1 = document.getElementById("num1");
            let num2 = document.getElementById("num2");
            if (num2.value === ""){
                num2.value = num1.value;
            }

            const rowsData = [
                ['NOME', document.getElementById('nome').value],
                ['COGNOME', document.getElementById('cognome').value],
                ['CODICE FISCALE', document.getElementById('codice').value],
                ['CITTA', document.getElementById('citta').value],
                ['GESTORE TEL', document.getElementById('gestore').value],
                ['NUMERO DI TELEFONO', num1.value],
                ['MARCA DISPOSITIVO', document.getElementById('marca').value],
                ['MODELLO DISPOSITIVO', document.getElementById('modello').value],
                ['BREVE DESCRIZIONE DEL PROBLEMA', document.getElementById('descrizione').value],
                ['Recapito di contatto', num2.value]
            ];

            const tbody = document.getElementById("table-body");
            tbody.innerHTML = ''; 

            rowsData.forEach(function (coppia){
                const row = document.createElement("tr");
                const nameCell = document.createElement("td");
                nameCell.textContent = coppia[0];
                const valueCell = document.createElement("td");
                valueCell.textContent = coppia[1]; 
                row.appendChild(nameCell);
                row.appendChild(valueCell);
                tbody.appendChild(row);
            });

            document.getElementById('form').style.display = 'none';
            document.getElementById('table').style.display = 'table';
            document.getElementById('button').style.display = 'block';
        });

        
        document.getElementById('button').addEventListener('click', function() {
            document.getElementById('table').style.display = 'none';
            document.getElementById('button').style.display = 'none';
            document.getElementById('form').style.display = 'block';
        });
    </script>
</body>
</html>
