<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Assistenza telefoni</title>
</head>
<body class="p-4">
    <form id="form">
        <fieldset>
            <legend>DATI</legend>

            NOME
            <input id="nome" type="text" class="casella form-control w-25 mb-2" tabindex="1" maxlength="20">

            COGNOME
            <input id="cognome" type="text" class="casella form-control w-25 mb-2" tabindex="2" maxlength="20">

            CODICE FISCALE
            <input id="codice" type="text" class="casella form-control w-25 mb-2" tabindex="3" maxlength="16">

            CITTA
            <input id="citta" type="text" class="casella form-control w-25 mb-2" tabindex="4" maxlength="50">

            GESTORE TEL
            <select id="gestore" class="casella form-select w-25 mb-2" tabindex="5">
                <option value="" selected disabled>Seleziona gestore...</option>
                <option value="Vodafone">Vodafone</option>
                <option value="Iliad">Iliad</option>
                <option value="TIM">TIM</option>
                <option value="Altro">Altro</option>
            </select>
            <input id="gestore-altro" type="text" class="form-control w-25 mb-2" placeholder="Specifica altro gestore" maxlength="40" style="display: none;">

            NUMERO DI TELEFONO
            <input id="num1" type="number" class="casella form-control w-25 mb-2" tabindex="6">

            MARCA DISPOSITIVO
            <select id="marca" class="casella form-select w-25 mb-2" tabindex="7">
                <option value="" selected disabled>Seleziona marca...</option>
                <option value="Samsung">Samsung</option>
                <option value="Apple">Apple</option>
                <option value="Motorola">Motorola</option>
                <option value="Xiaomi">Xiaomi</option>
                <option value="Altro">Altro</option>
            </select>
            <input id="marca-altro" type="text" class="form-control w-25 mb-2" placeholder="Specifica altra marca" maxlength="30" style="display: none;">

            MODELLO DISPOSITIVO
            <input id="modello" type="text" class="casella form-control w-25 mb-2" tabindex="8" maxlength="30">

            BREVE DESCRIZIONE DEL PROBLEMA
            <input id="descrizione" type="text" class="casella form-control w-25 mb-2" tabindex="9" maxlength="100">

            Recapito di contatto (se diverso dal numero del dispositivo in riparazione)
            <input id="num2" type="number" class="casella form-control w-25 mb-3" tabindex="10">

            <input name="button" type="submit" id="submit" class="btn btn-primary" value="Invia">
        </fieldset>
    </form>

    <table id="table" class="table table-bordered w-50" style="display: none;">
        <thead>
            <tr>
                <th colspan="2">Ri-Generation – Via Pavoncelli 118, Bari<br>Ricevuta di consegna</th>
            </tr>
        </thead>
        <tbody id="table-body"></tbody>
    </table>

    <button id="button" type="button" class="btn btn-secondary mt-3" style="display: none;">Torna al form</button>

    <script>
        const gestoreSelect = document.getElementById("gestore");
        const gestoreAltro = document.getElementById("gestore-altro");
        const marcaSelect = document.getElementById("marca");
        const marcaAltro = document.getElementById("marca-altro");


        document.getElementById("form").addEventListener("submit", function(event) {
            event.preventDefault();

            const num1 = document.getElementById("num1");
            const num2 = document.getElementById("num2");

            if (num2.value === "") {
                num2.value = num1.value;
            }

            const gestoreValore = gestoreSelect.value === "Altro"
                ? gestoreAltro.value.trim()
                : gestoreSelect.value;

            const marcaValore = marcaSelect.value === "Altro"
                ? marcaAltro.value.trim()
                : marcaSelect.value;

            const rowsData = [
                ['NOME', document.getElementById('nome').value],
                ['COGNOME', document.getElementById('cognome').value],
                ['CODICE FISCALE', document.getElementById('codice').value],
                ['CITTA', document.getElementById('citta').value],
                ['GESTORE TEL', gestoreValore],
                ['NUMERO DI TELEFONO', num1.value],
                ['MARCA DISPOSITIVO', marcaValore],
                ['MODELLO DISPOSITIVO', document.getElementById('modello').value],
                ['BREVE DESCRIZIONE DEL PROBLEMA', document.getElementById('descrizione').value],
                ['Recapito di contatto', num2.value]
            ];

            const tbody = document.getElementById("table-body");
            tbody.innerHTML = '';

            rowsData.forEach(function(coppia) {
                const row = document.createElement("tr");

                const nameCell = document.createElement("td");
                nameCell.textContent = coppia[0];

                const valueCell = document.createElement("td");
                valueCell.textContent = coppia[1] || '-';

                row.appendChild(nameCell);
                row.appendChild(valueCell);
                tbody.appendChild(row);
            });

            document.getElementById('form').style.display = 'none';
            document.getElementById('table').style.display = 'table';
            document.getElementById('button').style.display = 'inline-block';
        });

        document.getElementById('button').addEventListener('click', function() {
            const form = document.getElementById('form');
            form.reset();

            gestoreAltro.style.display = 'none';
            marcaAltro.style.display = 'none';
            document.getElementById("table-body").innerHTML = '';

            document.getElementById('table').style.display = 'none';
            document.getElementById('button').style.display = 'none';
            form.style.display = 'block';
        });
    </script>
</body>
</html>
